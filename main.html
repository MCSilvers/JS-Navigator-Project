<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigator</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div id="app-container">
    
    <!-- Desk Number Display -->
    <div id="desk-number">Loading Desk...</div>

    <!-- Clock Widget -->
    <div id="clock-widget">
      <div id="clock"></div>
    </div>

    <!-- Upcoming Events Section (Now on the Left) -->
    <div id="calendar-widget">
      <h2>Schedule</h2>
      <ul id="events"></ul>
    </div>

    <!-- QR Code on the Right -->
    <div id="qr-container">
      <img src="default.png" alt="QR Code">
    </div>

  </div>

  <!-- Clock Script -->
  <script>
    function updateTime() {
      const now = new Date();
      const options = {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      };
      const timeString = now.toLocaleTimeString([], options);
      document.getElementById('clock').textContent = timeString;
    }

    setInterval(updateTime, 1000);
    updateTime();
  </script>
